version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Minor and patch updates arrive together as one pull request; major versions come separately.
      minor-and-patch:
        update-types: [minor, patch]
    # Major versions of these need deliberate work: @types/node follows the Node version in .nvmrc,
    # and the next eslint and typescript majors fail npm run check.
    ignore:
      - dependency-name: "@types/node"
        update-types: [version-update:semver-major]
      - dependency-name: eslint
        update-types: [version-update:semver-major]
      - dependency-name: typescript
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
